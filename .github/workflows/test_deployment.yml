# This waits for the backend to be available and then performs the deployment tests.
# The deployment tests are available in the 'deployment' folder in the root of the project.

name: Test Deployment
run-name: "Test deployment for the  ${{ inputs.execution-environment }} environment"

on:
  workflow_call:
    inputs:
      execution-environment:
        description: "Environment"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      execution-environment:
        type: choice
        description: "Environment"
        required: true
        default: 'beta'
        options:
        - beta
        - prod

jobs:
  deployment-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: ${{ inputs.execution-environment }}
    env:
      CANVAS_HOST: ${{ vars.CANVAS_HOST }}
      OAUTH_TOKEN: ${{ secrets.DEPLOYMENT_TESTS_OAUTH_TOKEN }}
      TEST_PATH: ${{ vars.DEPLOYMENT_TEST_PATH }}
    defaults:
      run:
        working-directory: deployment
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'deployment/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run install-browsers
      - run: npm test
      - name: Warn about skipped tests
        if: always()
        continue-on-error: true
        run: |
          if grep -rE 'test\.(fixme|skip)' ./*.test.* 2>/dev/null; then
            echo "::warning::One or more deployment tests are currently skipped — check deployment/deployment.test.js and re-enable once upstream issues are resolved"
            echo "## ⚠️ Skipped deployment tests" >> $GITHUB_STEP_SUMMARY
            echo "One or more tests are marked \`fixme\` or \`skip\` in \`deployment/deployment.test.js\`." >> $GITHUB_STEP_SUMMARY
            echo "Re-enable them once upstream issues are resolved." >> $GITHUB_STEP_SUMMARY
            grep -rE 'test\.(fixme|skip)' ./*.test.* >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - name: Upload test-results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event.repository.name }}-test-results-${{ github.run_number }}-${{ github.run_attempt }}
          path: ./deployment/playwright-report/
          retention-days: 1
